name: CGV 센텀 IMAX 오디세이 예매 오픈 감시

# ⚠️ 중요 제약
#   새 CGV 사이트(cgv.co.kr)는 Cloudflare 뒤에 있어 해외/데이터센터 IP를 403으로 막습니다.
#   GitHub 호스팅 러너(ubuntu-latest)는 미국 IP라 대부분 차단됩니다.
#   => 안정적으로 돌리려면 한국에 있는 self-hosted runner(집 PC / 국내 VPS)를 쓰거나,
#      이 워크플로 대신 국내 머신에서 cron 으로 watch_cgv.py 를 직접 돌리세요.
#   아래 설정은 self-hosted runner 를 쓴다는 가정입니다. 호스팅 러너로 시도하려면
#   runs-on 을 ubuntu-latest 로 바꾸고, 자주 실패할 수 있음을 감안하세요.

on:
  schedule:
    - cron: '*/10 * * * *'   # 10분마다 (GitHub 사양상 지연될 수 있음)
  workflow_dispatch: {}

permissions:
  contents: write   # state.json 커밋용

jobs:
  watch:
    runs-on: [self-hosted, linux]   # 한국 IP 러너. 호스팅 러너로 시도하려면 ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 예매 오픈 여부 확인 및 디스코드 알림
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # 필요하면 대상 변경: CGV_SITE_NO / CGV_PLAY_YMD / CGV_MOVIE_KEYWORD 등
        run: python watch_cgv.py

      - name: state.json 변경사항 커밋
        run: |
          git config user.name "cgv-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state"
          git push
