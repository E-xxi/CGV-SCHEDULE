name: CGV 센텀 IMAX 오디세이 예매 오픈 감시

on:
  schedule:
    # 10분마다 실행 (UTC 기준 cron). GitHub 사양상 정확히 10분 간격이 100% 보장되진 않고,
    # 트래픽이 몰리면 몇 분 정도 밀릴 수 있습니다.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}   # Actions 탭에서 수동으로 "Run workflow" 버튼으로 즉시 실행 가능

permissions:
  contents: write   # state.json 변경사항을 커밋하기 위해 필요

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 예매 오픈 여부 확인 및 텔레그램 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch_cgv.py

      - name: state.json 변경사항 커밋
        run: |
          git config user.name "cgv-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state"
          git push
